---
- name: Restart munge
  ansible.builtin.service:
    name: munge
    state: restarted

- name: Restart mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted
  when: slurm_is_controller | bool

- name: Restart slurmdbd
  ansible.builtin.service:
    name: slurmdbd
    state: restarted
  when: slurm_is_controller | bool

- name: Restart slurmctld
  ansible.builtin.service:
    name: slurmctld
    state: restarted
  when: slurm_is_controller | bool

- name: Restart slurmd
  ansible.builtin.service:
    name: slurmd
    state: restarted
  when: slurm_is_compute | bool

- name: Re-export NFS
  ansible.builtin.command: exportfs -ra
  changed_when: true
