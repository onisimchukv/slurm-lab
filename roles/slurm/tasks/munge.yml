---
- name: Ensure munge directories have the right owner and mode
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: munge
    group: munge
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/munge, mode: "0700" }
    - { path: /var/lib/munge, mode: "0711" }
    - { path: /var/log/munge, mode: "0700" }
    - { path: /run/munge, mode: "0755" }

- name: Generate the munge key on the controller (once)
  ansible.builtin.shell: |
    set -o pipefail
    dd if=/dev/urandom bs=1 count=1024 2>/dev/null > /etc/munge/munge.key
    chown munge:munge /etc/munge/munge.key
    chmod 0400 /etc/munge/munge.key
  args:
    executable: /bin/bash
    creates: /etc/munge/munge.key
  when: slurm_is_controller | bool

- name: Read the controller's munge key
  ansible.builtin.slurp:
    src: /etc/munge/munge.key
  delegate_to: "{{ slurm_controller_host }}"
  run_once: true
  register: slurm_munge_key
  no_log: true

- name: Distribute the munge key to the other nodes
  ansible.builtin.copy:
    content: "{{ slurm_munge_key.content | b64decode }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  when: not (slurm_is_controller | bool)
  no_log: true
  notify: Restart munge

- name: Start munge
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true

- name: Check that munge can encode and decode a credential
  ansible.builtin.shell: set -o pipefail; munge -n | unmunge | grep -q 'STATUS:.*Success'
  args:
    executable: /bin/bash
  changed_when: false
