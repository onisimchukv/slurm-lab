---
# Edit the addresses and SSH user to match your Synology VMM VMs.
# Host names here become the real hostnames and the Slurm node names.
all:
  vars:
    ansible_user: rocky
    ansible_become: true
  children:
    slurm_controller:
      hosts:
        ctl:
          ansible_host: 192.168.1.50
    slurm_compute:
      hosts:
        c1:
          ansible_host: 192.168.1.51
        c2:
          ansible_host: 192.168.1.52
